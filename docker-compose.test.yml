
services:

  # Run a simple registry pull-through cache for testing
  registry:
    image: sut
    environment:
      DNS_TLD: example.test
      REGISTRY2_PROXY_ENABLED: true
    configs:
      - source: api_cert
        target: /certs/private/api.example.test.pem
    tmpfs:
      - /data:exec

  docker:
    image: docker:29.10.1-dind@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: --insecure-registry=registry:80 --registry-mirror=http://registry:80 --tls=false --debug
    depends_on:
      - registry
    tmpfs:
      - /var/lib/docker:exec

  sut:
    image: docker:29.10.1@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0
    environment:
      DOCKER_HOST: tcp://docker:2375
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        apk add --no-cache curl
        count=1
        while ! docker info 2>/dev/null && [ "$${count}" -le 10 ]; do
          sleep 1
          count=$$((count + 1))
        done
        docker run --rm hello-world
        curl -v http://registry:80/v2/_catalog | grep hello-world
    depends_on:
      - docker
      - registry

