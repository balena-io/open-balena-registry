
services:

  # Run a simple registry pull-through cache for testing
  registry:
    image: sut
    environment:
      REGISTRY2_PROXY_ENABLED: true
      API_TOKENAUTH_JWKS: 
    tmpfs:
      - /data:exec

  docker:
    image: docker:29.9.3-dind@sha256:d035bd30886e451b2727ef3cdb9af9a5c537a10d4bc5d18c08d0ffa597e46aeb
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: --insecure-registry=registry:80 --registry-mirror=http://registry:80 --tls=false --debug
    depends_on:
      - registry
    tmpfs:
      - /var/lib/docker:exec

  sut:
    image: docker:29.9.3@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
    environment:
      DOCKER_HOST: tcp://docker:2375
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        apk add --no-cache curl
        count=1
        while ! docker info 2>/dev/null && [ "$${count}" -le 10 ]; do
          sleep 1
          count=$$((count + 1))
        done
        docker run --rm hello-world
        curl -v http://registry:80/v2/_catalog | grep hello-world
    depends_on:
      - docker
      - registry
