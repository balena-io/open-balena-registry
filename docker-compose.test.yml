
services:

  # Run a simple registry pull-through cache for testing
  registry:
    image: sut
    environment:
      REGISTRY2_PROXY_ENABLED: true
      API_TOKENAUTH_JWKS: 
    tmpfs:
      - /data:exec

  docker:
    image: docker:29.8.2-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: --insecure-registry=registry:80 --registry-mirror=http://registry:80 --tls=false --debug
    depends_on:
      - registry
    tmpfs:
      - /var/lib/docker:exec

  sut:
    image: docker:29.8.2@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
    environment:
      DOCKER_HOST: tcp://docker:2375
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        apk add --no-cache curl
        count=1
        while ! docker info 2>/dev/null && [ "$${count}" -le 10 ]; do
          sleep 1
          count=$$((count + 1))
        done
        docker run --rm hello-world
        curl -v http://registry:80/v2/_catalog | grep hello-world
    depends_on:
      - docker
      - registry
